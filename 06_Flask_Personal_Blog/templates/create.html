{% extends "base.html" %}

{% block title %}Create Post | My Personal Blog{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-header">
        <p class="eyebrow">CREATE CONTENT</p>
        <h1>Create a New Post</h1>
        <p>Share your ideas, knowledge and experiences with the community.</p>
    </div>

    <form method="post" class="post-form">

        <label for="title">Post Title</label>
        <input
            id="title"
            type="text"
            name="title"
            placeholder="Enter your post title"
            required
        >

        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option value="Technology">Technology</option>
            <option value="Python">Python</option>
            <option value="Web Development">Web Development</option>
            <option value="AI & Machine Learning">AI & Machine Learning</option>
            <option value="Career">Career</option>
            <option value="Personal">Personal</option>
            <option value="Education">Education</option>
        </select>

        <label for="content">Post Content</label>
        <textarea
            id="content"
            name="content"
            rows="12"
            placeholder="Write your post here..."
            required
        ></textarea>

        <div class="form-actions">
            <a href="{{ url_for('index') }}" class="secondary-button">
                Cancel
            </a>

            <button type="submit" class="hero-button">
                Publish Post
            </button>
        </div>

    </form>

</div>

{% endblock %}
