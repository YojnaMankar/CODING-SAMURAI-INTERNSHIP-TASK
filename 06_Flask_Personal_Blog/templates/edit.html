{% extends "base.html" %}

{% block title %}Edit Post | My Personal Blog{% endblock %}

{% block content %}

<div class="editor-page">

    <div class="editor-header">

        <div>
            <p class="eyebrow">EDIT CONTENT</p>

            <h1>Edit Your Post</h1>

            <p>
                Update your post and keep your content fresh.
            </p>
        </div>

        <a class="secondary-button"
           href="{{ url_for('index') }}">
            ← Back to Blog
        </a>

    </div>

    <form method="post" class="post-form">

        <label for="title">Post Title</label>

        <input
            id="title"
            name="title"
            type="text"
            value="{{ post['title'] }}"
            maxlength="150"
            required
        >

        <label for="content">Content</label>

        <textarea
            id="content"
            name="content"
            required
        >{{ post['content'] }}</textarea>

        <div class="form-actions">

            <a class="cancel-button"
               href="{{ url_for('index') }}">
                Cancel
            </a>

            <button type="submit">
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
